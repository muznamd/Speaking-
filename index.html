<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dramatic Irony: Listen, Write, Speak</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#d8f4e8;--ink:#2b1a33;--card:#fff;--pink:#e2306a;--sand:#e9a03c;--ok:#1d8a5a;--bad:#c4302b;--mute:#6b5a73;--line:#b7dccb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2a27;--ink:#f1e8f5;--card:#2a3a36;--mute:#b9c9c2;--line:#41564f;--pink:#ff5c8f;--ok:#5fd39b;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#1d2a27;--ink:#f1e8f5;--card:#2a3a36;--mute:#b9c9c2;--line:#41564f;--pink:#ff5c8f;--ok:#5fd39b;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0 0 8px}
h1{font-size:2.3rem;font-weight:800}h2{font-size:1.5rem}
p{margin:0 0 12px}.mute{color:var(--mute);font-size:.95rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 18px;background:var(--pink);color:#fff;cursor:pointer;min-height:48px}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
button.big{width:100%;margin:6px 0}button:disabled{opacity:.45;cursor:default}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
textarea{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink);min-height:90px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 auto}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:var(--sand)}
.bar.ok i{background:var(--ok)}.bar.bad i{background:var(--bad)}
.w{display:inline-block;padding:1px 7px;margin:2px;border-radius:8px;font-weight:700}
.w.g{background:var(--ok);color:#fff}.w.x{background:var(--bad);color:#fff}.w.m{border:2px dashed var(--bad)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.msg{font-weight:700;margin:8px 0}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.dots{display:flex;gap:6px;margin:8px 0 14px}.dots b{flex:1;height:8px;border-radius:4px;background:var(--line)}.dots b.d{background:var(--ok)}.dots b.c{background:var(--pink)}
@media (prefers-reduced-motion:no-preference){.rec{animation:p 1s infinite}@keyframes p{50%{opacity:.55}}}
</style></head><body><main id="app"></main>

function align(a,b){ // a=target words, b=typed words -> per-target status via LCS
  const n=a.length,m=b.length,D=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=a[i]===b[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
  const ok=Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(D[i+1][j]>=D[i][j+1])i++;else j++}
  return ok}
function home(){
  const ready=keyReady();
  app.innerHTML=`<h1>Dramatic irony: listen, write, speak</h1>
  <p>Ten short clips from the video “In on a secret? That’s dramatic irony.” First you write what you hear. Then you copy the speaker’s voice.</p>
  ${ready?'':`<div class="card"><h2>Teacher setup needed</h2><p>Listen to each clip once and type what is said. It is saved on this device and the game unlocks.</p></div>`}
  <button class="big" id="b1" ${ready?'':'disabled'}>Phase 1: Listen and write</button>
  <button class="big" id="b2" ${ready?'':'disabled'}>Phase 2: Speak like the video</button>
  <button class="big alt" id="bt">Teacher setup: type the clip texts</button>`;
  $('#b1').onclick=()=>{S={p:1,i:0,tries:0,pts:0,done:{}};ph1()};
  $('#b2').onclick=()=>{S={p:2,i:0,tries:0,pts:0,done:{}};ph2()};
  $('#bt').onclick=setup}
function setup(){
  app.innerHTML=`<div class="top"><h2>Teacher setup</h2><button class="alt" id="bk">Back</button></div><p class="mute">Type each clip exactly as spoken. Students never see this page unless they open it.</p>`+
  CLIPS.map((c,i)=>`<div class="card"><div class="row"><b>Clip ${i+1}</b><button class="alt" data-p="${i}">Play</button></div><textarea data-k="${i}" aria-label="Text of clip ${i+1}">${KEY[i]||''}</textarea></div>`).join('')+`<button class="big" id="sv">Save texts</button>`;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>play(+b.dataset.p));
  $('#bk').onclick=home;
  $('#sv').onclick=()=>{document.querySelectorAll('[data-k]').forEach(t=>KEY[+t.dataset.k]=t.value.trim());saveKey();home()}}
const dots=()=>`<div class="dots">${CLIPS.map((_,i)=>`<b class="${S.done[i]?'d':i==S.i?'c':''}"></b>`).join('')}</div>`;
function end(){app.innerHTML=`<h1>Finished</h1><div class="card"><h2>${S.pts} points</h2><p>${Object.keys(S.done).length} of ${CLIPS.length} clips passed.</p></div>${S.p==1?'<button class="big" id="g2">Continue to Phase 2</button>':''}<button class="big alt" id="h">Back to menu</button>`;$('#h').onclick=home;if(S.p==1)$('#g2').onclick=()=>{S={p:2,i:0,tries:0,pts:S.pts,done:{}};ph2()}}
function ph1(){
  const i=S.i;if(i>=CLIPS.length)return end();
  app.innerHTML=`<div class="top"><h2>Phase 1: Write it</h2><b>${S.pts} pts</b></div>${dots()}
  <div class="card"><p>Clip ${i+1} of ${CLIPS.length}. Listen as many times as you need.</p>
  <button class="big" id="pl">Play clip</button>
  <textarea id="tx" placeholder="Type what you hear" autocapitalize="off" spellcheck="false"></textarea>
  <button class="big" id="ck">Check</button><div id="fb"></div></div>
  <div class="row"><button class="alt" id="sk">Skip this clip</button><button class="alt" id="g2">Go to Phase 2</button></div>`;
  $('#sk').onclick=()=>{S.i++;S.tries=0;ph1()};
  $('#g2').onclick=()=>{S={p:2,i:0,tries:0,pts:S.pts,done:{}};ph2()};
  $('#pl').onclick=()=>play(i);
  $('#ck').onclick=()=>{
    const t=norm(KEY[i]),u=norm($('#tx').value);if(!u.length)return;
    const ok=align(t,u),n=ok.filter(Boolean).length,pct=n/t.length,fb=$('#fb');S.tries++;
    if(pct>=.9){const g=Math.max(1,4-S.tries)*10;S.pts+=g;S.done[i]=1;
      fb.innerHTML=`<p class="msg ok">Accepted. +${g} points</p><p>${KEY[i]}</p><button class="big" id="nx">Next clip</button>`;$('#ck').disabled=true;
      $('#nx').onclick=()=>{S.i++;S.tries=0;ph1()};return}
    const show=S.tries>=3;
    fb.innerHTML=`<p class="msg bad">Not yet: ${n} of ${t.length} words match. Listen again.</p><div>${t.map((w,k)=>ok[k]?`<span class="w g">${w}</span>`:show?`<span class="w x">${w}</span>`:`<span class="w m">${'_'.repeat(Math.min(w.length,8))}</span>`).join('')}</div>${show?`<button class="big alt" id="nx">Show answer and go on</button>`:''}`;
    if(show)$('#nx').onclick=()=>{S.i++;S.tries=0;ph1()}}}
// ---------- Phase 2 audio analysis ----------
const AC=window.AudioContext||window.webkitAudioContext;
async function decode(buf){const c=new AC();const d=await c.decodeAudioData(buf.slice(0));c.close();
  const x=d.getChannelData(0),f=4,y=new Float32Array(Math.floor(x.length/f));
  for(let i=0;i<y.length;i++){let s=0;for(let k=0;k<f;k++)s+=x[i*f+k];y[i]=s/f}return{y,sr:d.sampleRate/f}}
function feats({y,sr}){
  const H=Math.round(sr*.02),N=Math.round(sr*.04),env=[],pit=[];
  for(let p=0;p+N<y.length;p+=H){let e=0;for(let k=0;k<N;k++)e+=y[p+k]**2;env.push(Math.sqrt(e/N))}
  const mx=Math.max(...env,1e-9),thr=mx*.08,on=env.map(e=>e>thr);
  let a=on.indexOf(true),b=on.lastIndexOf(true);if(a<0)return null;
  const E=env.slice(a,b+1).map(e=>e/mx),O=on.slice(a,b+1);
  for(let q=a;q<=b;q++){if(!on[q]){pit.push(0);continue}
    const p=q*H,lo=Math.floor(sr/400),hi=Math.floor(sr/70);let best=0,bl=0,e0=0;
    for(let k=0;k<N;k++)e0+=y[p+k]**2;
    for(let l=lo;l<=hi;l++){let s=0;for(let k=0;k+l<N;k++)s+=y[p+k]*y[p+k+l];if(s>best){best=s;bl=l}}
    pit.push(best/(e0+1e-9)>.35?sr/bl:0)}
  const v=pit.filter(Boolean).sort((a,b)=>a-b),med=v[Math.floor(v.length/2)]||1;
  return{E,O,dur:(b-a+1)*H/sr,P:pit.map(p=>p?12*Math.log2(p/med):null)}}
function rs(a,n,fill){const o=[];for(let i=0;i<n;i++){const j=Math.min(a.length-1,Math.floor(i*a.length/n)),v=a[j];o.push(v==null?fill:v)}return o}
function corr(a,b){const n=a.length,ma=a.reduce((s,x)=>s+x)/n,mb=b.reduce((s,x)=>s+x)/n;let s=0,x=0,y=0;
  for(let i=0;i<n;i++){s+=(a[i]-ma)*(b[i]-mb);x+=(a[i]-ma)**2;y+=(b[i]-mb)**2}return s/Math.sqrt(x*y+1e-9)}
function pauses(F){const r=[];let run=0;F.O.forEach((o,i)=>{if(!o)run++;else{if(run*.02>.2)r.push(+(i/F.O.length).toFixed(2));run=0}});return r}
function compare(m,u){
  const rhythm=Math.max(0,corr(rs(m.E,60,0),rs(u.E,60,0)));
  const pm=rs(m.P,40,0),pu=rs(u.P,40,0),tone=Math.max(0,corr(pm,pu));
  const ratio=u.dur/m.dur,pace=Math.max(0,1-Math.abs(1-ratio)*2);
  const a=pauses(m),b=pauses(u);let hit=0;a.forEach(x=>{if(b.some(y=>Math.abs(x-y)<.12))hit++});
  const pause=a.length?Math.max(0,hit/a.length-Math.max(0,b.length-a.length)*.15):(b.length?.5:1);
  return{rhythm,tone,pace,pause,ratio}}
let mCache={};
async function modelFeats(i){if(mCache[i])return mCache[i];const r=await fetch(CLIPS[i].a),f=feats(await decode(await r.arrayBuffer()));return mCache[i]=f}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function meter(l,v){const c=v>=.6?'ok':v<.4?'bad':'';return`<div>${l}: ${Math.round(v*100)}%</div><div class="bar ${c}"><i style="width:${Math.round(v*100)}%"></i></div>`}
function ph2(){
  const i=S.i;if(i>=CLIPS.length)return end();
  app.innerHTML=`<div class="top"><h2>Phase 2: Speak it</h2><b>${S.pts} pts</b></div>${dots()}
  <div class="card"><p>Clip ${i+1} of ${CLIPS.length}. Listen, then say the same words with the same pauses and tone.</p>
  <p class="mute">${KEY[i]}</p>
  <button class="big alt" id="pl">Play model</button>
  <button class="big" id="rc">Record my voice</button><div id="fb"></div></div>
  <div class="row"><button class="alt" id="sk">Skip this phrase</button></div>`;
  $('#sk').onclick=()=>{if(au)au.pause();S.i++;S.tries=0;ph2()};
  $('#pl').onclick=()=>play(i);
  let mr,chunks=[],rec,heard='',on=false;
  $('#rc').onclick=async()=>{
    const fb=$('#fb'),btn=$('#rc');
    if(on){mr.stop();return}
    try{var st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){fb.innerHTML='<p class="msg bad">The microphone is blocked. Allow microphone access in the browser and try again.</p>';return}
    chunks=[];heard='';mr=new MediaRecorder(st);on=true;
    mr.ondataavailable=e=>chunks.push(e.data);
    if(SR){rec=new SR();rec.lang='en-US';rec.continuous=true;rec.onresult=e=>{heard=[...e.results].map(r=>r[0].transcript).join(' ')};try{rec.start()}catch(e){}}
    mr.onstop=async()=>{on=false;st.getTracks().forEach(t=>t.stop());try{rec&&rec.stop()}catch(e){}
      btn.textContent='Record my voice';btn.classList.remove('rec');fb.innerHTML='<p>Checking…</p>';
      await new Promise(r=>setTimeout(r,500));
      try{const u=feats(await decode(await new Blob(chunks).arrayBuffer())),m=await modelFeats(i);
        if(!u||u.dur<.5){fb.innerHTML='<p class="msg bad">I could not hear you. Speak closer to the microphone.</p>';return}
        const c=compare(m,u);S.tries++;
        let wp=null;if(SR){const t=norm(KEY[i]);wp=align(t,norm(heard)).filter(Boolean).length/t.length}
        const pass=(wp==null||wp>=.8)&&c.rhythm>=.55&&c.tone>=.4&&c.pace>=.5&&c.pause>=.5;
        let tip=[];if(wp!=null&&wp<.8)tip.push('Some words were not clear. Say every word.');
        if(c.pace<.5)tip.push(c.ratio>1?'You are too slow. Speed up.':'You are too fast. Slow down.');
        if(c.pause<.5)tip.push('Copy the speaker’s pauses: stop where the speaker stops.');
        if(c.tone<.4)tip.push('Copy the melody: where does the voice go up and down?');
        if(c.rhythm<.55)tip.push('Copy the rhythm and stress of the words.');
        fb.innerHTML=(wp==null?'':meter('Words',wp))+meter('Rhythm and stress',c.rhythm)+meter('Tone (melody)',c.tone)+meter('Pauses',c.pause)+meter('Speed',c.pace)+
          (pass?`<p class="msg ok">Accepted. +${Math.max(1,4-S.tries)*10} points</p><button class="big" id="nx">Next phrase</button>`:`<p class="msg bad">Not accepted. Try again.</p><ul>${tip.map(t=>`<li>${t}</li>`).join('')}</ul>`)+
          (heard?`<p class="mute">I heard: ${heard}</p>`:'');
        if(pass){S.pts+=Math.max(1,4-S.tries)*10;S.done[i]=1;$('#nx').onclick=()=>{S.i++;S.tries=0;ph2()}}
      }catch(e){fb.innerHTML='<p class="msg bad">Recording failed. Try again.</p>'}};
    mr.start();btn.textContent='Stop recording';btn.classList.add('rec')}}
home();
</script></body></html>
